<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Organize suas tarefas."
    />
    <title>TO-DO LIST</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="header">
        <div class="container">
            <div class="header__branch">
                <img class="header__icon" src="/assets/img/rules-icon.svg" alt="To-Do List">
                <h1 class="header__title">To-Do List</h1>
            </div>
        </div>
    </header>
    <main class="container">
        <div class="task">
            <div class="task__header">
                <h2 class="task__title">Tarefas</h2>
                <p class="task__description">Organize suas tarefas</p>
            </div>
            <div class="task__card">
                <form class="task__form">
                    <input
                    type="text"
                    class="task__input"
                    placeholder="Adicione uma nova tarefa"
                    >
                    <button type="submit" class="task__button"><img class="task__button-icon" src="/assets/img/plus-line-icon.svg" alt="">Adicionar</button>
                </form>
            </div>
        </div>
    </main>
    <script src="js/script.js"></script>
  </body>
</html>
